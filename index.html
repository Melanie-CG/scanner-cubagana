<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Scanner Cubagana</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f4f4f4;
      font-family: Arial, sans-serif;
      color: #111;
    }

    .card {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 28px;
      border-radius: 28px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
    }

    h1 {
      text-align: center;
      font-size: 36px;
      margin: 0 0 8px;
    }

    .subtitle {
      text-align: center;
      font-size: 22px;
      color: #666;
      margin-bottom: 35px;
    }

    label {
      display: block;
      font-size: 22px;
      font-weight: bold;
      margin-top: 22px;
      margin-bottom: 10px;
    }

    select {
      width: 100%;
      padding: 18px;
      font-size: 22px;
      border: 2px solid #ccc;
      border-radius: 18px;
      background: white;
    }

    button {
      width: 100%;
      margin-top: 28px;
      padding: 20px;
      border: none;
      border-radius: 18px;
      font-size: 23px;
      font-weight: bold;
      cursor: pointer;
    }

    #startBtn {
      background: #111;
      color: white;
    }

    #stopBtn {
      display: none;
      background: #ddd;
      color: #111;
    }

    #reader {
      margin-top: 28px;
      border-radius: 22px;
      overflow: hidden;
    }

    #status {
      margin-top: 18px;
      text-align: center;
      font-size: 20px;
      color: #666;
    }

    #result {
      display: none;
      margin-top: 24px;
      padding: 25px;
      border-radius: 22px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
    }

    .success {
      background: #dff5e5;
      color: #146c2e;
    }

    .duplicate {
      background: #fff1c7;
      color: #7a5800;
    }

    .expired,
    .unknown,
    .error {
      background: #ffdede;
      color: #8b0000;
    }

    .name {
      font-size: 30px;
      margin-bottom: 10px;
    }

    .details {
      font-size: 18px;
      font-weight: normal;
      margin-top: 8px;
    }
  </style>
</head>

<body>

<div class="card">

  <h1>💃 Scanner Cubagana</h1>

  <div class="subtitle">
    Contrôle des adhésions et des présences
  </div>

  <label for="controleur">
    Contrôleur
  </label>

  <select id="controleur">
    <option value="">Chargement des contrôleurs...</option>
  </select>

  <label for="cours">
    Discipline
  </label>

  <select id="cours">
    <option value="">Choisir une discipline</option>
    <option value="Salsa">Salsa</option>
    <option value="Bachata">Bachata</option>
    <option value="Lady Style">Lady Style</option>
  </select>

  <button id="startBtn" onclick="startScanner()">
    📷 Démarrer le scan
  </button>

  <button id="stopBtn" onclick="stopScanner()">
    Arrêter la caméra
  </button>

  <div id="reader"></div>

  <div id="status"></div>

  <div id="result"></div>

</div>


<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbxqxN3G5sxRZr4nNCmOtZv33DgoJ8ruTDtOjl-LZnG77-bq_eNyzJ4j5MqmptYZMo77gg/exec";

let scanner = null;
let scannerRunning = false;
let locked = false;


// ======================================================
// CHARGEMENT DES CONTRÔLEURS
// ======================================================

async function chargerControleurs() {

  const select =
    document.getElementById("controleur");

  try {

    const response =
      await fetch(
        API_URL + "?action=controleurs&t=" + Date.now(),
        {
          method: "GET",
          cache: "no-store"
        }
      );

    if (!response.ok) {
      throw new Error(
        "Erreur HTTP " + response.status
      );
    }

    const data =
      await response.json();

    select.innerHTML =
      '<option value="">Choisir un contrôleur</option>';

    if (
      !data.ok ||
      !Array.isArray(data.controleurs)
    ) {
      throw new Error(
        data.message ||
        "Liste des contrôleurs indisponible."
      );
    }

    if (data.controleurs.length === 0) {

      select.innerHTML =
        '<option value="">Aucun contrôleur trouvé</option>';

      return;
    }

    data.controleurs.forEach(
      function(nom) {

        const option =
          document.createElement("option");

        option.value = nom;
        option.textContent = nom;

        select.appendChild(option);

      }
    );

  }
  catch(error) {

    console.error(error);

    select.innerHTML =
      '<option value="">Erreur chargement contrôleurs</option>';

    showResult({
      type: "error",
      message:
        "Impossible de charger la liste des contrôleurs. " +
        (error.message || error)
    });

  }

}


// ======================================================
// AFFICHAGE
// ======================================================

function showResult(data) {

  const result =
    document.getElementById("result");

  result.style.display =
    "block";

  result.className =
    data.type || "error";

  let html = "";

  if (data.adherent) {

    const prenom =
      data.adherent.prenom || "";

    const nom =
      data.adherent.nom || "";

    html +=
      '<div class="name">' +
      escapeHtml(
        prenom + " " + nom
      ) +
      '</div>';

    if (data.adherent.cours) {

      html +=
        '<div class="details">' +
        escapeHtml(
          data.adherent.cours
        ) +
        '</div>';

    }

    if (data.adherent.formule) {

      html +=
        '<div class="details">' +
        escapeHtml(
          data.adherent.formule
        ) +
        '</div>';

    }

  }

  html +=
    '<div style="margin-top:12px;">' +
    escapeHtml(
      data.message || ""
    ) +
    '</div>';

  result.innerHTML =
    html;
}


function escapeHtml(text) {

  return String(text || "")
    .replace(
      /[&<>"']/g,
      function(c) {

        return {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        }[c];

      }
    );
}


// ======================================================
// DÉMARRAGE CAMÉRA
// ======================================================

async function startScanner() {

  const controleur =
    document.getElementById("controleur").value;

  const cours =
    document.getElementById("cours").value;

  if (!controleur) {

    showResult({
      type: "error",
      message:
        "Choisis un contrôleur."
    });

    return;
  }

  if (!cours) {

    showResult({
      type: "error",
      message:
        "Choisis une discipline."
    });

    return;
  }

  document.getElementById("result").style.display =
    "none";

  document.getElementById("status").textContent =
    "Ouverture de la caméra…";

  try {

    scanner =
      new Html5Qrcode("reader");

    const cameras =
      await Html5Qrcode.getCameras();

    if (
      !cameras ||
      cameras.length === 0
    ) {
      throw new Error(
        "Aucune caméra détectée."
      );
    }

    let cameraId =
      cameras[cameras.length - 1].id;

    const rearCamera =
      cameras.find(
        function(camera) {

          const label =
            String(
              camera.label || ""
            ).toLowerCase();

          return (
            label.includes("back") ||
            label.includes("rear") ||
            label.includes("environment") ||
            label.includes("arrière")
          );
        }
      );

    if (rearCamera) {
      cameraId = rearCamera.id;
    }

    await scanner.start(

      cameraId,

      {
        fps: 10,
        qrbox: {
          width: 250,
          height: 250
        }
      },

      onScanSuccess,

      function() {
        // Les images sans QR sont ignorées.
      }

    );

    scannerRunning =
      true;

    document.getElementById("startBtn").style.display =
      "none";

    document.getElementById("stopBtn").style.display =
      "block";

    document.getElementById("status").textContent =
      "Présentez la carte QR devant la caméra.";

  }
  catch(error) {

    console.error(error);

    showResult({
      type: "error",
      message:
        "Erreur caméra : " +
        (error.message || error)
    });

    document.getElementById("status").textContent =
      "";
  }

}


// ======================================================
// ARRÊT CAMÉRA
// ======================================================

async function stopScanner() {

  if (
    scanner &&
    scannerRunning
  ) {

    try {

      await scanner.stop();
      scanner.clear();

    }
    catch(error) {

      console.log(error);

    }

  }

  scannerRunning =
    false;

  scanner =
    null;

  document.getElementById("reader").innerHTML =
    "";

  document.getElementById("startBtn").style.display =
    "block";

  document.getElementById("stopBtn").style.display =
    "none";

  document.getElementById("status").textContent =
    "";

}


// ======================================================
// QR DÉTECTÉ
// ======================================================

async function onScanSuccess(decodedText) {

  if (locked) {
    return;
  }

  locked = true;

  document.getElementById("status").textContent =
    "QR détecté — vérification…";

  const controleur =
    document.getElementById("controleur").value;

  const cours =
    document.getElementById("cours").value;

  try {

    const url =
      API_URL +
      "?qr=" +
      encodeURIComponent(decodedText) +
      "&controleur=" +
      encodeURIComponent(controleur) +
      "&cours=" +
      encodeURIComponent(cours) +
      "&t=" +
      Date.now();

    const response =
      await fetch(
        url,
        {
          method: "GET",
          cache: "no-store"
        }
      );

    if (!response.ok) {

      throw new Error(
        "Réponse HTTP " +
        response.status
      );

    }

    const data =
      await response.json();

    showResult(data);

    if (navigator.vibrate) {

      if (data.ok) {
        navigator.vibrate(100);
      }
      else {
        navigator.vibrate([
          150,
          80,
          150
        ]);
      }

    }

    document.getElementById("status").textContent =
      data.ok
        ? "Prêt pour le prochain scan."
        : "Scan refusé — présentez une autre carte.";

  }
  catch(error) {

    console.error(error);

    showResult({
      type: "error",
      message:
        "Impossible de joindre Google Sheets. " +
        (error.message || error)
    });

    document.getElementById("status").textContent =
      "Erreur de connexion.";

  }

  setTimeout(
    function() {
      locked = false;
    },
    2500
  );

}


// ======================================================
// CHARGEMENT AU DÉMARRAGE
// ======================================================

window.addEventListener(
  "load",
  function() {
    chargerControleurs();
  }
);

</script>

</body>
</html>
